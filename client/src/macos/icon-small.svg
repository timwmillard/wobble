<svg xmlns="http://www.w3.org/2000/svg" width="1024" height="1024" viewBox="0 0 1024 1024">
  <!-- Wobble app icon for 16 and 32px: icon.svg without the pencil and
       confetti, with a bigger card and a heavier stroke so the W survives. -->
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#3B4150"/>
      <stop offset="1" stop-color="#191B22"/>
    </linearGradient>
    <linearGradient id="ink" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0" stop-color="#EF130B"/>
      <stop offset="0.25" stop-color="#FF7100"/>
      <stop offset="0.45" stop-color="#FFC800"/>
      <stop offset="0.65" stop-color="#00CC00"/>
      <stop offset="0.85" stop-color="#00B2FF"/>
      <stop offset="1" stop-color="#7A3CE0"/>
    </linearGradient>
  </defs>
  <rect x="64" y="64" width="896" height="896" rx="200" fill="url(#bg)"/>
  <g transform="rotate(-7 512 512)">
    <rect x="160" y="230" width="704" height="564" rx="56" fill="#FFFFFF"/>
    <path d="M270 340
             C 290 460, 312 570, 362 636
             C 392 676, 424 620, 442 568
             C 466 496, 482 438, 512 436
             C 552 436, 562 520, 584 584
             C 602 640, 636 674, 664 620
             C 706 540, 730 432, 754 330"
          fill="none" stroke="url(#ink)" stroke-width="96" stroke-linecap="round" stroke-linejoin="round"/>
  </g>
</svg>

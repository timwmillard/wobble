<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<title>Wobble</title>
<!-- Served at / and /r/<code>; the script and wasm live under /play. -->
<base href="/play/">
<style>
html,body { margin:0; width:100%; height:100%; overflow:hidden; background:#161820; }
#canvas { display:block; width:100%; height:100%; outline:none; touch-action:none; }
#status { position:absolute; padding:1rem; color:white; font:16px system-ui; }
</style>
</head>
<body>
<div id="status" role="status">Loading Wobble…</div>
<canvas id="canvas" aria-label="Wobble"></canvas>
<script>
// iOS: after a tap, Safari sends mouse events and a click of its own, which
// focus the tapped canvas (Raven makes it focusable) and so take the focus
// from Raven's text field: the keyboard closed as soon as it opened.
// Cancelling touchend stops them; Raven reads only pointer events.
document.getElementById("canvas").addEventListener("touchend", function(e) {
    e.preventDefault();
}, {passive: false});
// iOS opens the keyboard only for a focus() in the gesture's end. Raven
// focuses its text field on pointerdown when a field already had its focus
// (the name field on load, a field after the keyboard was put away), and
// then, finding it focused, doesn't again on pointerup: no keyboard. After
// Raven has had the pointerup (this listener is on the window, so it runs
// later), focus the field again unless the keyboard is already up.
window.addEventListener("pointerup", function(e) {
    var raven = Module.ravenDOM;
    if (e.pointerType !== "touch" || !raven || !raven.field.mode) return;
    var viewport = window.visualViewport;
    if (viewport && viewport.height < window.innerHeight - 100) return;
    var target = raven.field.mode === 2 ? raven.secure : raven.textarea;
    if (document.activeElement === target) target.blur();
    target.focus({preventScroll: true});
});
// The app's command line, from the page: the socket server is this host,
// the room is /r/<code> or ?room=, and ?name= fills the name.
function wobbleArguments() {
    var args = ["--server", (location.protocol === "https:" ? "wss://" : "ws://") + location.host];
    var query = new URLSearchParams(location.search);
    var match = location.pathname.match(/\/r\/([A-Za-z0-9-]+)/);
    var room = match ? match[1] : query.get("room");
    if (room) args.push("--room", room);
    if (query.get("name")) args.push("--name", query.get("name"));
    return args;
}
var Module = {
    arguments: wobbleArguments(),
    canvas: document.getElementById("canvas"),
    onRuntimeInitialized: function() {
        document.getElementById("status").hidden = true;
    },
    // Raven focuses its first field, but the browser's own focus stays on the
    // page until a click, so typing went nowhere. Once Raven has a text field
    // focused, move the browser's focus into it, unless the page has given
    // it to something else meanwhile.
    postRun: [function focusFirstField() {
        var frames = 0;
        (function poll() {
            var raven = Module.ravenDOM;
            if (document.activeElement && document.activeElement !== document.body) return;
            if (raven && raven.field.mode) return raven.focusInput();
            if (++frames < 120) requestAnimationFrame(poll);
        })();
    }],
    onAbort: function(reason) {
        document.getElementById("status").hidden = false;
        document.getElementById("status").textContent = "Wobble couldn't start: " + reason;
    }
};
</script>
{{{ SCRIPT }}}
</body>
</html>
